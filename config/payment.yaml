spring:
  application:
    name: "${SPRING_APPLICATION_NAME:payment}"
  cache:
    type: redis
  data:
    redis:
      host: "${REDIS_HOST:redis}"
      port: "${REDIS_PORT:6379}"
  batch:
    jdbc:
      initialize-schema: "${SPRING_BATCH_JDBC_INITIALIZE_SCHEMA:always}"
  datasource:
    url: "${DB_URL}"
  cloud:
    function:
      definition: userCreatedConsumer;businessCreatedConsumer
    stream:
      bindings:
        userCreatedConsumer-in-0:
          destination: "${KAFKA_TOPIC_USER_CREATED:user-created}"
          group: "${KAFKA_GROUP_ID:payment-service}"
          content-type: "application/json"
        businessCreatedConsumer-in-0:
          destination: "${KAFKA_TOPIC_BUSINESS_CREATED:business-created}"
          group: "${KAFKA_GROUP_ID:payment-service}"
          content-type: "application/json"
        transferCreated-out-0:
          destination: "${KAFKA_TOPIC_TRANSFER_CREATED:transfer-request-created}"
          content-type: "application/json"
      kafka:
        bindings:
          userCreatedConsumer-in-0:
            consumer:
              start-offset: earliest
              enable-dlq: true
              dlq-name: "${KAFKA_TOPIC_USER_CREATED:user-created}.dlq"
          businessCreatedConsumer-in-0:
            consumer:
              start-offset: earliest
              enable-dlq: true
              dlq-name: "${KAFKA_TOPIC_BUSINESS_CREATED:business-created}.dlq"

app:
  account:
    platform-number: "${APP_PLATFORM_ACCOUNT_NUMBER:671952927}"
  providers:
    pawapay:
      base-url: "${PAYMENT_EXTERNAL_SERVICE_PAWAPAY_URL:https://api.sandbox.pawapay.io/v2}"
      bearer-token: "${PAYMENT_PAWAPAY_BEARER_TOKEN:}"
      webhook-base-url: "${APP_WEBHOOK_BASE_URL_PAWAPAY:https://fastrelays/pawapay}"
      account-number: "${APP_PROVIDER_PAWAPAY_ACCOUNT_NUMBER:1000000002}"
      default-balance: "${APP_PROVIDER_PAWAPAY_DEFAULT_BALANCE:0}"
    sebpay:
      base-url: "${PAYMENT_EXTERNAL_SERVICE_SEBPAY_URL:https://newapi.sebpay.bj/api/v1}"
      public-key: "${PAYMENT_SEBPAY_PUBLIC_KEY:}"
      secret-key: "${PAYMENT_SEBPAY_SECRET_KEY:}"
      webhook-base-url: "${APP_WEBHOOK_BASE_URL_SEBPAY:https://fastrelays/sebpay}"
      account-number: "${APP_PROVIDER_SEBPAY_ACCOUNT_NUMBER:1000000003}"
      default-balance: "${APP_PROVIDER_SEBPAY_DEFAULT_BALANCE:0}"
    moneyfusion:
      enabled: "${PAYMENT_EXTERNAL_SERVICE_MONEYFUSION_ENABLED:true}"
      base-url: "${PAYMENT_EXTERNAL_SERVICE_MONEYFUSION_URL:https://pay.moneyfusion.net}"
      api-path: "${PAYMENT_MONEYFUSION_API_PATH:Fast_relays/73afe0e6111f0e1a/pay}"
      private-key: "${PAYMENT_MONEYFUSION_PRIVATE_KEY:}"
      webhook-base-url: "${APP_WEBHOOK_BASE_URL_MONEYFUSION:https://fastrelays/moneyfusion}"
      account-number: "${APP_PROVIDER_MONEYFUSION_ACCOUNT_NUMBER:1000000004}"
      default-balance: "${APP_PROVIDER_MONEYFUSION_DEFAULT_BALANCE:0}"
  external:
    service:
      pawapay:
        enabled: "${PAYMENT_EXTERNAL_SERVICE_PAWAPAY_ENABLED:true}"
        bearer-token: "${PAYMENT_PAWAPAY_BEARER_TOKEN:}"
        url: "${PAYMENT_EXTERNAL_SERVICE_PAWAPAY_URL}"
        token: "${PAYMENT_EXTERNAL_SERVICE_PAWAPAY_TOKEN}"
      moneyfusion:
        enabled: "${PAYMENT_EXTERNAL_SERVICE_MONEYFUSION_ENABLED:true}"
        url: "${PAYMENT_EXTERNAL_SERVICE_MONEYFUSION_URL:https://pay.moneyfusion.net}"
        api-path: "${PAYMENT_MONEYFUSION_API_PATH:}"
        private-key: "${PAYMENT_MONEYFUSION_PRIVATE_KEY:}"
