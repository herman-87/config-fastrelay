spring:
  application:
    name: "${SPRING_APPLICATION_NAME:likes}"
  datasource:
    url: "${DB_URL}"
  cache:
    type: redis
  data:
    redis:
      host: "${REDIS_HOST:redis}"
      port: "${REDIS_PORT:6379}"
  cloud:
    stream:
      bindings:
        likeCreated-out-0:
          destination: "${KAFKA_TOPIC_LIKE_CREATED:like-created}"
          content-type: "application/json"
        likeRemoved-out-0:
          destination: "${KAFKA_TOPIC_LIKE_REMOVED:like-removed}"
          content-type: "application/json"
