spring:
  application:
    name: "${SPRING_APPLICATION_NAME:messages}"
  cache:
    type: redis
  data:
    redis:
      host: "${REDIS_HOST:redis}"
      port: "${REDIS_PORT:6379}"
  datasource:
    url: "${DB_URL}"
  cloud:
    function:
      definition: orderRequestCreatedConsumer
    stream:
      bindings:
        orderRequestCreatedConsumer-in-0:
          destination: "${KAFKA_TOPIC_ORDER_REQUEST_CREATED:order-request-created}"
          group: "${KAFKA_GROUP_ID:messages-service}"
          content-type: "application/*+avro"
        conversationCreated-out-0:
          destination: "${KAFKA_TOPIC_CONVERSATION_CREATED:conversation-created}"
      kafka:
        binder:
          consumer-properties:
            specific.avro.reader: true
        bindings:
          conversationCreated-out-0:
            producer:
              useNativeEncoding: true
          orderRequestCreatedConsumer-in-0:
            consumer:
              start-offset: earliest
              enable-dlq: true
              dlq-name: "${KAFKA_TOPIC_ORDER_REQUEST_CREATED:order-request-created}.dlq"
