spring:
  application:
    name: "${SPRING_APPLICATION_NAME:order}"
  cache:
    type: redis
  data:
    redis:
      host: "${REDIS_HOST:redis}"
      port: "${REDIS_PORT:6379}"
  datasource:
    url: "${DB_URL}"
  cloud:
    function:
      definition: userCreatedConsumer;transferRequestCreatedConsumer
    stream:
      bindings:
        userCreatedConsumer-in-0:
          destination: "${KAFKA_TOPIC_USER_CREATED:user-created}"
          group: "${KAFKA_GROUP_ID:order-service}"
          content-type: "application/*+avro"
        transferRequestCreatedConsumer-in-0:
          destination: "${KAFKA_TOPIC_TRANSFER_REQUEST_CREATED:transfer-request-created}"
          group: "${KAFKA_GROUP_ID:order-service}"
          content-type: "application/*+avro"
        orderRequestCreated-out-0:
          destination: "${KAFKA_TOPIC_ORDER_REQUEST_CREATED:order-request-created}"
        orderPaid-out-0:
          destination: "${KAFKA_TOPIC_ORDER_PAID:order-paid}"
        orderAccepted-out-0:
          destination: "${KAFKA_TOPIC_ORDER_ACCEPTED:order-accepted}"
        orderDelivered-out-0:
          destination: "${KAFKA_TOPIC_ORDER_DELIVERED:order-delivered}"
        orderDeliveryAccepted-out-0:
          destination: "${KAFKA_TOPIC_ORDER_DELIVERY_ACCEPTED:order-delivery-accepted}"
      kafka:
        binder:
          consumer-properties:
            specific.avro.reader: true
            value.deserializer: "io.confluent.kafka.serializers.KafkaAvroDeserializer"
        bindings:
          orderRequestCreated-out-0:
            producer:
              useNativeEncoding: true
          orderPaid-out-0:
            producer:
              useNativeEncoding: true
          orderAccepted-out-0:
            producer:
              useNativeEncoding: true
          orderDelivered-out-0:
            producer:
              useNativeEncoding: true
          orderDeliveryAccepted-out-0:
            producer:
              useNativeEncoding: true
          userCreatedConsumer-in-0:
            consumer:
              useNativeDecoding: true
              configuration:
                value.deserializer: "io.confluent.kafka.serializers.KafkaAvroDeserializer"
              start-offset: earliest
              enable-dlq: true
              dlq-name: "${KAFKA_TOPIC_USER_CREATED:user-created}.dlq"
          transferRequestCreatedConsumer-in-0:
            consumer:
              start-offset: earliest
              enable-dlq: true
              dlq-name: "${KAFKA_TOPIC_TRANSFER_REQUEST_CREATED:transfer-request-created}.dlq"
